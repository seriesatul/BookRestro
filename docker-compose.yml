services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bookrestro-postgres
    environment:
      POSTGRES_USER: bookrestro
      POSTGRES_PASSWORD: bookrestro
      POSTGRES_DB: bookrestro
    ports:
      - "5432:5432"
    volumes:
      - bookrestro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookrestro -d bookrestro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookrestro-postgres:
